[project]
name = "llm-evaluation-frameworks-analysis"
version = "0.1.0"
description = "TC2 experiments comparing LLM evaluation frameworks"
readme = "README.md"
requires-python = "==3.12.10"
dependencies = [
    "datasets==5.0.1",
    "deepeval==4.2.8",
    "httpx==0.28.1",
    "langchain-community==0.4.1",
    "matplotlib==3.11.2",
    "mlflow==3.17.1",
    "numpy==2.5.4",
    "ollama==0.6.3",
    "opik==2.2.99",
    "pandas==3.0.6",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "ragas==0.4.3",
    "scipy==1.18.1",
    "sentence-transformers==6.1.0",
    "tqdm==4.70.1",
    "transformers==5.17.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff==0.17.0",
]
